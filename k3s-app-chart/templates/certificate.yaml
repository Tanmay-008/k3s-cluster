{{- if .Values.certificate.enabled }}

apiVersion: cert-manager.io/v1
kind: Certificate

metadata:
  name: {{ default (printf "%s-tls" .Release.Name) .Values.certificate.name }}
  namespace: {{ default .Release.Namespace .Values.certificate.namespace }}

spec:
  secretName: {{ default (printf "%s-tls" .Release.Name) .Values.certificate.secretName }}

  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer

  dnsNames:
    {{- range .Values.certificate.dnsNames }}
    - {{ . | quote }}
    {{- end }}

{{- end }}