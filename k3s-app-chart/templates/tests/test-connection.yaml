apiVersion: v1
kind: Pod
metadata:
  name: {{ include "k3s-apps.fullname" . }}-test
  labels:
    {{- include "k3s-apps.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox
      command:
        - wget
        - "{{ include "k3s-apps.fullname" . }}:{{ .Values.service.port }}"