# templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: {{ include "k3s-apps.fullname" . }}
  labels:
    {{- include "k3s-apps.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "k3s-apps.selectorLabels" . | nindent 4 }}