replicaCount: 1

image:
  repository: ""
  tag: ""
  pullPolicy: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: false
  className: nginx
  host: example.local
  path: /
  pathType: Prefix

env: []

configMap:
  enabled: false

secret:
  enabled: false

# autoscaling:
#   enabled: false
#   minReplicas: 1
#   maxReplicas: 3
#   targetCPUUtilizationPercentage: 80

healthCheck:
  enabled: false
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10
  readinessInitialDelaySeconds: 5
  readinessPeriodSeconds: 10serviceAccount
  create: false
  annotations: {}
  automount: false

httpRoute:
  enabled: false
  parentRefs:
    name: ""
  host: ""

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

serviceAccount:
  create: false
  annotations: {}
  automount: false