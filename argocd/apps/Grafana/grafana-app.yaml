apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: 'https://grafana-community.github.io/helm-charts'
      chart: grafana
      targetRevision: 10.5.15
      helm:
        valueFiles:
          - $values/projects/grafana/grafana-values.yaml
          
    - repoURL: 'https://github.com/Tanmay-008/k3s-cluster.git'
      targetRevision: main
      ref: values
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: grafana
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true