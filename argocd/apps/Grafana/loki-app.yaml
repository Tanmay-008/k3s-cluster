apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: 'https://grafana-community.github.io/helm-charts'
      chart: loki
      targetRevision: 18.12.1
      helm:
        valueFiles:
          - $values/projects/grafana/loki-values.yaml
          - secrets+gpg-import:///helm-secrets-private-keys/key.txt?$values/projects/grafana/grafana-secrets-encrypt.yaml

    - repoURL: 'https://github.com/Tanmay-008/k3s-cluster.git'
      targetRevision: main
      ref: values
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: grafana
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true