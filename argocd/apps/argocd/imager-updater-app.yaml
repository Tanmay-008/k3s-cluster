apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
spec:
  project: default
  sources: 
    - repoURL: 'https://argoproj.github.io/argo-helm'
      targetRevision: 0.9.1
      chart: argocd-image-updater
      helm:
        valueFiles:
          - $values/projects/argocd/image-updater-values.yaml
          
    - repoURL: 'https://github.com/Tanmay-008/k3s-cluster.git'
      targetRevision: main
      ref: values
      
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true