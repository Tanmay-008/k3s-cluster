apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  template:
    spec:
      volumes:
        - name: custom-tools
          emptyDir: {}
        - name: helm-plugins
          emptyDir: {}
        - name: sops-age
          secret:
            secretName: sops-age

      initContainers:
        - name: install-helm-secrets
          image: alpine:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              apk add --no-cache curl tar
              SOPS_VERSION=3.9.4
              HELM_SECRETS_VERSION=4.7.7
              
              # 1. Install sops into custom-tools
              echo "==> Installing sops v${SOPS_VERSION}..."
              curl -fsSL "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64" -o /custom-tools/sops
              chmod +x /custom-tools/sops
              echo "==> sops installed successfully."
              
              # 2. Install helm-secrets plugin
              echo "==> Installing helm-secrets v${HELM_SECRETS_VERSION}..."
              mkdir -p /helm-plugins/helm-secrets
              curl -fsSL "https://github.com/jkroepke/helm-secrets/releases/download/v${HELM_SECRETS_VERSION}/helm-secrets.tar.gz" -o /tmp/helm-secrets.tar.gz
              tar -xzf /tmp/helm-secrets.tar.gz -C /helm-plugins/helm-secrets --strip-components=1
              rm /tmp/helm-secrets.tar.gz
              chmod -R 755 /helm-plugins/
              
              echo "==> Verifying plugin installation:"
              ls -la /helm-plugins/helm-secrets/
              
              if [ -f /helm-plugins/helm-secrets/plugin.yaml ]; then
                echo "==> helm-secrets plugin.yaml FOUND. Installation successful!"
              else
                echo "==> ERROR: plugin.yaml NOT FOUND! Installation failed."
                exit 1
              fi
          volumeMounts:
            - name: custom-tools
              mountPath: /custom-tools
            - name: helm-plugins
              mountPath: /helm-plugins

      containers:
        - name: repo-server
          image: quay.io/argoproj/argocd:v2.11.3 
          env:
            - name: PATH
              value: "/custom-tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            - name: HELM_PLUGINS
              value: /home/argocd/.local/share/helm/plugins
            - name: SOPS_AGE_KEY_FILE
              value: /home/argocd/.config/sops/age/keys.txt
            - name: HELM_SECRETS_SOPS_PATH
              value: /custom-tools/sops
          volumeMounts:
            - name: custom-tools
              mountPath: /custom-tools
            - name: helm-plugins
              mountPath: /home/argocd/.local/share/helm/plugins
            - name: sops-age
              mountPath: /home/argocd/.config/sops/age/keys.txt
              subPath: keys.txt
              readOnly: true