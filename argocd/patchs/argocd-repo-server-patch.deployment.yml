apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  template:
    spec:
      volumes:
        - name: ksops-binaries 
          emptyDir: {}
        - name: sops-age
          secret:
            secretName: sops-age

      initContainers:
        - name: install-ksops
          image: viaductoss/ksops:v4.5.1
          command: ["/usr/local/bin/ksops", "install", "--with-kustomize", "/custom-tools"]
          args:
            - |
              set -e
              echo "Installing KSOPS binary..."
              cp /ksops /custom-tools/ksops
              chmod +x /custom-tools/ksops
              chown 999:999 /custom-tools/ksops
              echo "KSOPS binary installed successfully."
          volumeMounts:
            - name: ksops-binaries 
              mountPath: /custom-tools

      containers:
        - name: repo-server
          image: quay.io/argoproj/argocd:v3.4.6
          env:
            - name: PATH
              value: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/custom-tools"
            - name: XDG_CONFIG_HOME
              value: /home/argocd/.config
            - name: SOPS_AGE_KEY_FILE
              value: /home/argocd/.config/sops/age/keys.txt
          volumeMounts:
            - name: ksops-binaries
              mountPath: /usr/local/bin/ksops
              subPath: ksops
            - name: ksops-binaries
              mountPath: /home/argocd/.config/kustomize/plugin/viaduct.ai/v1/ksops/ksops
              subPath: ksops
            - name: sops-age
              mountPath: /home/argocd/.config/sops/age/keys.txt
              subPath: keys.txt
              readOnly: true