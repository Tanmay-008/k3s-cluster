apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  template:
    spec:
      volumes:
        - name: kustomize-plugins
          emptyDir: {}
        - name: sops-age
          secret:
            secretName: sops-age

      initContainers:
        - name: install-ksops
          image: viaductoss/ksops:v4.1.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Setting up KSOPS plugin structure..."
              mkdir -p /custom-plugins/viaduct.ai/v1/ksops/
              
              if [ -f /ksops ]; then
                cp /ksops /custom-plugins/viaduct.ai/v1/ksops/ksops
              elif [ -f /usr/local/bin/ksops ]; then
                cp /usr/local/bin/ksops /custom-plugins/viaduct.ai/v1/ksops/ksops
              else
                cp $(which ksops) /custom-plugins/viaduct.ai/v1/ksops/ksops
              fi
              
              chmod +x /custom-plugins/viaduct.ai/v1/ksops/ksops
              echo "KSOPS binary successfully copied!"
          volumeMounts:
            - name: kustomize-plugins
              mountPath: /custom-plugins

      containers:
        - name: repo-server
          image: quay.io/argoproj/argocd:v3.4.6
          env:
            - name: XDG_CONFIG_HOME
              value: /home/argocd/.config
            - name: SOPS_AGE_KEY_FILE
              value: /home/argocd/.config/sops/age/keys.txt
          volumeMounts:
            - name: kustomize-plugins
              mountPath: /home/argocd/.config/kustomize/plugin
            - name: sops-age
              mountPath: /home/argocd/.config/sops/age/keys.txt
              subPath: keys.txt  
              readOnly: true