apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  template:
    spec:
      volumes:
        - name: custom-tools
          emptyDir: {}
        - name: helm-plugins
          emptyDir: {}
        - name: sops-age
          secret:
            secretName: sops-age

      initContainers:
        - name: install-helm-secrets
          image: alpine:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              apk add --no-cache curl tar
              SOPS_VERSION=3.9.4
              HELM_SECRETS_VERSION=4.7.7
              
              # 1. Install sops into custom-tools
              curl -fsSL "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64" -o /custom-tools/sops
              chmod +x /custom-tools/sops
              
              # 2. Install helm-secrets as a wrapper directly into custom-tools
              mkdir -p /helm-plugins
              curl -fsSL "https://github.com/jkroepke/helm-secrets/releases/download/v${HELM_SECRETS_VERSION}/helm-secrets.tar.gz" \
                | tar -xz -C /helm-plugins
              
              # Copy the wrapper to override helm command
              cp /helm-plugins/helm-secrets/scripts/wrapper/helm.sh /custom-tools/helm
              chmod +x /custom-tools/helm
          volumeMounts:
            - name: custom-tools
              mountPath: /custom-tools
            - name: helm-plugins
              mountPath: /helm-plugins

      containers:
        - name: repo-server
          image: quay.io/argoproj/argocd:v2.11.3 
          env:
            - name: PATH
              value: "/custom-tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            - name: HELM_PLUGINS
              value: /home/argocd/.local/share/helm/plugins
            - name: SOPS_AGE_KEY_FILE
              value: /home/argocd/.config/sops/age/keys.txt
            - name: HELM_SECRETS_WRAPPER_ENABLED
              value: "true"
          volumeMounts:
            - name: custom-tools
              mountPath: /custom-tools
            - name: helm-plugins
              mountPath: /home/argocd/.local/share/helm/plugins
            - name: sops-age
              mountPath: /home/argocd/.config/sops/age/keys.txt
              subPath: keys.txt
              readOnly: true