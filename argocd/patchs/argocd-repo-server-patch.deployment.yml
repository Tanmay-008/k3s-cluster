apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  template:
    spec:
      volumes:
        - name: ksops-binaries 
          emptyDir: {}
        - name: sops-age
          secret:
            secretName: sops-age

      initContainers:
        - name: install-ksops
          image: viaductoss/ksops:v4.5.1
          command: ["/usr/local/bin/ksops", "install", "--with-kustomize", "/custom-tools"]
          volumeMounts:
            - name: ksops-binaries
              mountPath: /custom-tools

      containers:
        - name: repo-server
          image: quay.io/argoproj/argocd:v3.4.6
          env:
            - name: PATH
              value: "/custom-tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            - name: XDG_CONFIG_HOME
              value: /home/argocd/.config
            - name: SOPS_AGE_KEY_FILE
              value: /home/argocd/.config/sops/age/keys.txt
          volumeMounts:
            - name: ksops-binaries
              mountPath: /custom-tools
            - name: sops-age
              mountPath: /home/argocd/.config/sops/age/keys.txt
              subPath: keys.txt
              readOnly: true