apiVersion: apps/v1
kind: Deployment
metadata:
  name: room-service-deployment
  labels:
    app: room-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: room-service

  template:
    metadata:
      labels:
        app: room-service
    spec:
      containers:
      - name: room-service
        image: tanmay678/room-service:latest
        ports:
        - containerPort: 5000

        envFrom: 
        # - configMapRef:
        #     name: roomservice-config
        # - secretRef:
            name: roomservice-secret