k3s-apps-chart:
  appName: backend
  replicaCount: 1
  image:
    repository: tanmay678/syncwrite-backend
    tag: 1.0.17
  service:
    type: ClusterIP
    name: syncwrite-backend-service
    port: 80
    targetPort: 4000
  ingress:
    enabled: true
    className: nginx
    host: api-syncwrite.tanmayshirbhayye.tech
    tls:
      enabled: true
      secretName: syncwrite-backend-tls
    paths:
    - path: /
      pathType: Prefix
      serviceName: syncwrite-backend-service
      port: 80
  healthCheck:
    enabled: false
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  secret:
    enabled: true
    secretName: backend-secret
image:
  name: tanmay678/syncwrite-backend
