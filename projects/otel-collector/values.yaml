mode: daemonset

image:
  repository: otel/opentelemetry-collector-contrib

presets:
  logsCollection:
    enabled: true
  kubernetesAttributes:
    enabled: true

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

    k8sobjects:
      objects:
        - name: events
          mode: watch

  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 1000
      spike_limit_mib: 200

    transform:
      error_mode: ignore
      log_statements:
        - context: log
          statements:
            - set(severity_text, "INFO") where severity_text == ""
            - set(attributes["level"], severity_text)
            
            - set(resource.attributes["namespace"], resource.attributes["k8s.namespace.name"]) where resource.attributes["k8s.namespace.name"] != nil
            - set(resource.attributes["pod"], resource.attributes["k8s.pod.name"]) where resource.attributes["k8s.pod.name"] != nil
            - set(resource.attributes["container"], resource.attributes["k8s.container.name"]) where resource.attributes["k8s.container.name"] != nil
            
            - set(resource.attributes["app"], resource.attributes["service.name"]) where resource.attributes["service.name"] != nil
            - set(resource.attributes["app"], resource.attributes["k8s.container.name"]) where resource.attributes["service.name"] == nil and resource.attributes["k8s.container.name"] != nil

    batch:
      timeout: 1s
      send_batch_size: 1000
      send_batch_max_size: 1500

  exporters:
    otlphttp:
      endpoint: "http://loki.observability.svc.cluster.local:3100/otlp"
      tls:
        insecure: true

    debug:
      verbosity: basic

  service:
    pipelines:
      logs:
        receivers:
          - otlp
          - filelog        
          - k8sobjects
        processors:
          - memory_limiter
          - k8sattributes  
          - transform
          - batch
        exporters:
          - otlphttp
          - debug