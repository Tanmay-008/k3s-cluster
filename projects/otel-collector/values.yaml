mode: daemonset

image:
  repository: otel/opentelemetry-collector-k8s

config:

  receivers:

    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

    filelog:
      include_file_path: true
      include:
        - /var/log/pods/*/*/*.log

      operators:
        - id: container-parser
          type: container

    k8sobjects:
      objects:
        - name: events
          mode: watch

  processors:
    k8sattributes:
      auth_type: serviceAccount
      extract:
        metadata:
          - k8s.pod.name
          - k8s.namespace.name
          - k8s.container.name
          - k8s.deployment.name

  service:

    pipelines:

      logs:
        receivers:
          - otlp
          - filelog
          - k8sobjects

        processors: []

        exporters:
          - debug