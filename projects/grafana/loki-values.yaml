deploymentMode: Monolithic

singleBinary:
  replicas: 1

loki:
  commonConfig:
    replication_factor: 1
  
  singleBinary:
    replicas: 1
    extraArgs:
      - "-config.expand-env=true"
    env:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: grafana-secrets
            key: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: grafana-secrets
            key: AWS_SECRET_ACCESS_KEY

  schemaConfig:
    configs:
      - from: "2026-09-10"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage_config:
    aws:
      region: eu-north-1
      bucketnames: pgstay-logs-chunks
      s3forcepathstyle: false

  pattern_ingester:
    enabled: true

  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 240h
 
  chunks_cache:
    enabled: true
    allocatedMemory: 128
    
  storage:
    type: s3

    bucketNames:
      chunks: pgstay-logs-chunks
      ruler: pgstay-logs-ruler
      admin: pgstay-logs-admin

    s3:
      endpoint: https://s3.eu-north-1.amazonaws.com
      region: eu-north-1
      accessKeyId: ${AWS_ACCESS_KEY_ID}
      secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
      signatureVersion: v4
      s3ForcePathStyle: false
      insecure: false
      http_config: {}

minio:
  enabled: false

# Disable other deployment modes
backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

ingester:
  replicas: 0

querier:
  replicas: 0

queryFrontend:
  replicas: 0

queryScheduler:
  replicas: 0

distributor:
  replicas: 0

compactor:
  replicas: 0

indexGateway:
  replicas: 0

bloomPlanner:
  replicas: 0

bloomBuilder:
  replicas: 0

bloomGateway:
  replicas: 0