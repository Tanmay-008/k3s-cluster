apiVersion: apps/v1
kind: Deployment
metadata:
  name: room-service-deployment
  labels:
    app: room-srvice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: room-service
  template:
    metadata:
      labels:
        app: room-service
    spec:
      containers:
      - name: room-service
        image: nginx:1.14.2
        ports:
        - containerPort: 80